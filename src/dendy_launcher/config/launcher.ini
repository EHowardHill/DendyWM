# Dendy Launcher Configuration File
# Modify these values to customize the launcher appearance and behavior

[Window]
initial_width = 1920
initial_height = 1080

[Grid]
min_cols = 3
max_cols = 5
cell_width = 300
cell_height = 300

[Icons]
icon_size = 196
icon_padding = 64

[Layout]
top_margin = 128
bottom_margin = 100
scroll_padding = 50
text_height = 32

[Animation]
scroll_speed = 15
smooth_scroll_factor = 0.15
gamepad_deadzone = 0.25
selection_scale = 1.1
animation_speed = 0.2
fade_in_duration = 0.1
tile_stagger_delay = 0.03
tile_animation_duration = 0.5
launch_animation_duration = 0.6

[Assets]
bg_music = "assets/bg02.mp3"
snd_move = "assets/move.wav"
snd_select = "assets/select.wav"
snd_login = "assets/login.wav"
font_url = "assets/fonts/Bogart-Black-trial.ttf"
font_url_launcher = "assets/fonts/Bogart-Medium-trial.ttf"
logo_url = "assets/logo.png"
